<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu 1º Site com CI/CD</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #000000 0%, #DC143C 60%, #FFD700 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.95);
      padding: 50px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      text-align: center;
      max-width: 600px;
      animation: fadeIn 1s ease-in-out;
    }

    h1 {
      color: #DC143C;
      margin-bottom: 20px;
      font-size: 2.5em;
    }

    p {
      color: #333;
      font-size: 1.2em;
      line-height: 1.6;
      margin-bottom: 30px;
    }

    .status {
      background: #FFD700;
      color: #000;
      padding: 15px 30px;
      border-radius: 50px;
      display: inline-block;
      font-weight: bold;
      margin-top: 20px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
    }

    .version {
      margin-top: 30px;
      color: #777;
      font-size: 0.9em;
    }

    .signature {
      margin-top: 40px;
      font-size: 0.9em;
      font-weight: bold;
      color: #000;
      letter-spacing: 1px;
    }

    .signature span {
      color: #DC143C;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Deploy Automático</h1>
    <p>Este site foi implantado automaticamente usando GitHub Actions e CI/CD.</p>
    <p>Toda vez que você faz push para o repositório, o deploy acontece automaticamente na sua VM!</p>
    <div class="status">✓ Sistema Online</div>
    <div class="version">Versão 1.0.0</div>
    <div class="signature">Assinado por <span>Daniel Satel</span></div>
  </div>
</body>
</html>
